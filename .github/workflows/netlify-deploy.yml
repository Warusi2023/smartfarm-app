name: Deploy to Netlify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Verify static publish directory
      run: |
        # Static web assets live under web-project/public (not repo-root public/).
        test -d web-project/public || (echo "❌ web-project/public missing" && exit 1)
        test -f web-project/public/index.html || (echo "❌ index.html missing" && exit 1)
        test -f web-project/public/livestock-management.html || (echo "❌ livestock-management.html missing" && exit 1)
        echo "✅ Publish directory web-project/public OK"
        
    - name: Install dependencies
      run: |
        if [ -f package.json ]; then
          npm ci
        fi
        
    - name: Build (if needed)
      run: |
        if [ -f package.json ] && [ -f netlify.toml ]; then
          # Check if build command is needed
          if grep -q "command.*npm run build" netlify.toml; then
            npm run build
          else
            echo "No build command needed - serving static files"
          fi
        fi
        
    - name: Deploy to Netlify
      uses: nwtgck/actions-netlify@v2.0
      with:
        # Confirmed path: web-project/public (contains index.html, livestock-management.html, etc.)
        publish-dir: './web-project/public'
        production-branch: main
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "Deploy from GitHub Actions - ${{ github.event.head_commit.message }}"
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      timeout-minutes: 1
